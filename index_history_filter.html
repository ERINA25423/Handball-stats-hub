<!DOCTYPE html>
<html lang="ja">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111827">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Handball Stats Hub">

<link rel="apple-touch-icon" href="icon-192.png">
  <head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>Handball Stats Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- =========================
       GLOBAL HEADER
  ========================== -->

  <header id="appHeader">
    <h1>Handball Stats Hub</h1>

    <div class="match-info">
      <span id="half">1st Half</span>
      <span id="timer">00:00</span>
    </div>
  </header>


  <main>

    <!-- =========================
         HOME
    ========================== -->

    <section id="homeScreen" class="screen">

      <h1>Handball Stats Hub</h1>

      <button id="newMatchButton">
        NEW MATCH
      </button>

      <button id="matchHistoryButton">
        MATCH HISTORY
      </button>

    </section>


    <!-- =========================
         MATCH SETUP
    ========================== -->

    <section
      id="matchSetup"
      class="match-setup screen"
      hidden
    >

      <button
        id="noMatchStartedButton"
        type="button"
      >
        ← NO MATCH STARTED
      </button>

      <h2>MATCH INFORMATION</h2>

      <div class="match-fields">

        <label>
          DATE
          <input
            id="matchDate"
            type="date"
          >
        </label>

        <label>
          MY TEAM
          <input
            id="myTeamName"
            type="text"
            placeholder="Team name"
          >
        </label>

        <label>
          OPPONENT
          <input
            id="opponentName"
            type="text"
            placeholder="Opponent name"
          >
        </label>

      </div>

      <button
        id="startMatch"
        class="start-match-button"
      >
        START MATCH
      </button>

    </section>


    <!-- =========================
         GAME SCREEN
    ========================== -->

    <section
      id="gameScreen"
      class="screen"
      hidden
    >

      <!-- TOP CONTROL BAR -->

      <div class="game-topbar">

        <div class="teams">

          <button
            id="myTeam"
            class="team active"
          >
            MY TEAM
          </button>

          <button
            id="opponent"
            class="team"
          >
            OPPONENT
          </button>

        </div>


        <div class="game-clock">

          <button data-time="-10">
            −10s
          </button>

          <button data-time="-1">
            −1s
          </button>

          <button id="timerToggle">
            START
          </button>

          <button data-time="1">
            +1s
          </button>

          <button data-time="10">
            +10s
          </button>

        </div>

      </div>


      <!-- MAIN RECORDING AREA -->

      <div class="recording-grid">


        <!-- POSITION -->

        <section class="record-panel position-panel">

          <h2>POSITION</h2>

          <div class="positions">

  <!-- 1段目 -->
  <button class="player-position" data-position="LW">
    <span class="position-name">LW</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <button class="player-position" data-position="PV">
    <span class="position-name">PV</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <button class="player-position" data-position="RW">
    <span class="position-name">RW</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <!-- 2段目 -->
  <button class="player-position" data-position="LB">
    <span class="position-name">LB</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <button class="player-position" data-position="CB">
    <span class="position-name">CB</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <button class="player-position" data-position="RB">
    <span class="position-name">RB</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <!-- 3段目 -->
  <button class="player-position" data-position="GK">
    <span class="position-name">GK</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

  <button class="player-position" data-position="EP">
    <span class="position-name">EP</span>
    <input class="player-name" type="text" maxlength="2" placeholder="#">
  </button>

        </section>


        <!-- SHOT COURSE -->

        <section class="record-panel course-panel">

          <h2>SHOT COURSE</h2>

          <div
            class="goal-grid"
            id="goalGrid"
          >

            <button data-course="LT">LT</button>
            <button data-course="CT">CT</button>
            <button data-course="RT">RT</button>

            <button data-course="LM">LM</button>
            <button data-course="CM">CM</button>
            <button data-course="RM">RM</button>

            <button data-course="LB">LB</button>
            <button data-course="CB">CB</button>
            <button data-course="RB">RB</button>

          </div>

        </section>


        <!-- SHOT TYPE -->

        <section class="record-panel type-panel">

          <h2>SHOT TYPE</h2>

          <div class="shot-types">

            <button>
              Normal
            </button>

            <button>
              Fast Break
            </button>

            <button>
              7m
            </button>

          </div>

        </section>


        <!-- RESULT -->

        <section class="record-panel result-panel">

          <h2>RESULT</h2>

          <div class="results">

            <button data-result="GOAL">
              GOAL
            </button>

            <button data-result="SAVED">
              SAVED
            </button>

            <button data-result="MISS">
              MISS
            </button>

            <button data-result="BLOCK">
              BLOCK
            </button>

          </div>

        </section>

      </div>


      <!-- BOTTOM ACTION BAR -->

      <div class="game-bottom-bar">


        <!-- OTHER -->

        <div class="popup-control">

          <button
            id="otherToggle"
            class="small-action-button"
            type="button"
          >
            OTHER
          </button>

          <div
            id="otherPanel"
            class="floating-panel"
            hidden
          >

            <div class="events">

              <button data-event="TURNOVER">
                TURNOVER
              </button>

              <button data-event="PENALTY">
                PENALTY
              </button>

              <button data-event="TIMEOUT">
                TIMEOUT
              </button>

              <button data-event="OTHER">
  OTHER
</button>
              
            </div>

          </div>

        </div>


        <!-- HISTORY -->

        <div class="popup-control">

          <button
            id="historyToggle"
            class="small-action-button"
            type="button"
          >
            HISTORY
          </button>

          <div
            id="historyPanel"
            class="floating-panel history-popup"
            hidden
          >

            <div class="history-header">

              <h2>
                EVENT HISTORY
              </h2>

              <button id="undo">
                UNDO
              </button>

            </div>

            <div class="history-filter">
              <button class="active" data-filter="ALL">ALL</button>
              <button data-filter="MY TEAM">MY TEAM</button>
              <button data-filter="OPPONENT">OPPONENT</button>
            </div>

            <div id="history"></div>

          </div>

        </div>


        <!-- SMALL CONTROLS -->

        <button
          id="undoQuick"
          class="small-action-button"
          type="button"
        >
          UNDO
        </button>

        <button
          id="halfToggle"
          class="small-action-button"
        >
          CHANGE HALF
        </button>


        <!-- SAVE -->

        <button
          id="saveEvent"
          class="save-event-button"
        >
          SAVE EVENT
        </button>


        <!-- END MATCH -->

        <button
          id="endMatchButton"
          class="end-match-button"
        >
          END &amp; SAVE MATCH
        </button>

      </div>

    </section>


    <!-- =========================
         MATCH HISTORY
    ========================== -->

    <section
      id="matchHistoryScreen"
      class="screen"
      hidden
    >

      <h2>MATCH HISTORY</h2>

      <button id="backToHomeFromHistory">
        ← BACK
      </button>

      <div id="matchHistoryList"></div>

    </section>


    <!-- =========================
         ANALYSIS
    ========================== -->

    <section
      id="analysisScreen"
      class="screen"
      hidden
    >

      <div class="analysis-header">

        <button id="backToHistory">
          ← MATCH HISTORY
        </button>

        <div id="analysisMatchInfo">
          MATCH ANALYSIS
        </div>

      </div>


      <div class="analysis-tabs">

        <button
          class="analysis-tab active"
          data-analysis-tab="overview"
        >
          OVERVIEW
        </button>

        <button
          class="analysis-tab"
          data-analysis-tab="players"
        >
          PLAYERS
        </button>

        <button
          class="analysis-tab"
          data-analysis-tab="goalkeepers"
        >
          GK
        </button>

        <button
          class="analysis-tab"
          data-analysis-tab="team"
        >
          TEAM
        </button>

        <button
          class="analysis-tab"
          data-analysis-tab="shotmap"
        >
          SHOT MAP
        </button>

      </div>


      <div
        id="analysisOverview"
        class="analysis-panel"
      >

        <h2>OVERVIEW</h2>

        <div id="overviewContent"></div>

      </div>


      <div
        id="analysisPlayers"
        class="analysis-panel"
        hidden
      >

        <h2>COURT PLAYERS</h2>

        <div id="playersList"></div>

      </div>


      <div
        id="analysisGoalkeepers"
        class="analysis-panel"
        hidden
      >

        <h2>GOALKEEPERS</h2>

        <div id="goalkeepersList"></div>

      </div>


      <div
        id="analysisTeam"
        class="analysis-panel"
        hidden
      >

        <h2>TEAM DETAIL</h2>

        <div id="teamAnalysisContent"></div>

      </div>


      <div
        id="analysisShotmap"
        class="analysis-panel"
        hidden
      >

        <h2>SHOT MAP</h2>

        <div id="shotMapContent"></div>

      </div>

    </section>

  </main>

</div>

<!-- =========================
     LOGIN
========================= -->

<div id="loginArea">
  <button type="button" id="googleLoginBtn" onclick="loginWithGoogle()">
    Googleでログイン
  </button>

  <button type="button" id="logoutBtn" onclick="logout()" style="display:none;">
    ログアウト
  </button>
</div>

<script type="module" src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
